<div class="container">

<div class="capture-section">

  <h2>Capture New Lead</h2>

  <form class="form">

    <!-- NAME -->
    <input type="text"
           placeholder="Client Name *"
           [(ngModel)]="lead.name"
           name="name"
           #name="ngModel"
           required
           [class.invalid]="name.invalid && name.touched">

    <small class="error"
           *ngIf="name.invalid && name.touched">
      Name is required
    </small>


    <!-- PHONE -->
    <input type="text"
           placeholder="Phone Number *"
           [(ngModel)]="lead.phone"
           name="phone"
           #phone="ngModel"
           required
           pattern="^[0-9]{10}$"
           maxlength="10"
           [class.invalid]="phone.invalid && phone.touched">

    <small class="error"
           *ngIf="phone.errors?.['required'] && phone.touched">
      Phone number is required
    </small>

    <small class="error"
           *ngIf="phone.errors?.['pattern'] && phone.touched">
      Phone must be exactly 10 digits
    </small>


    <!-- EMAIL -->
    <input type="email"
           placeholder="Email Address"
           [(ngModel)]="lead.email"
           name="email"
           #email="ngModel"
           pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$"
           [class.invalid]="email.invalid && email.touched">

    <small class="error"
           *ngIf="email.errors?.['pattern'] && email.touched">
      Enter a valid email address
    </small>


    <!-- SAVE BUTTON -->
    <button type="button"
            (click)="submitLead()"
            [disabled]="!isFormValid"
            [class.disabled-btn]="!isFormValid">
      Save Lead
    </button>

  </form>

</div>


</div>


    <!-- Display Saved Leads -->
    <div class="lead-list" *ngIf="leadsList.length > 0">
      <h3>Saved Leads</h3>
      <div class="lead-card" *ngFor="let l of leadsList">
        <p><strong>Name:</strong> {{l.name}}</p>
        <p><strong>Phone:</strong> {{l.phone}}</p>
        <p><strong>Email:</strong> {{l.email}}</p>
      </div>
    </div>




  <!-- ================= BOTTOM NAV ================= -->
