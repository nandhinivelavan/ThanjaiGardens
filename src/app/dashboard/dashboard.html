<div class="dashboard">


    <div class="top-card">
        <img class="gradient-image" src="/images/privyr/dashboard/gradientimage.jpg">
        <div class="total-leads">
            <h3>Total Leads</h3>
            <h1>484</h1>
            <p>
                <span class="growth"><img class="arrow-img" src="/images/arrow.png"> 12%</span>
                vs last week
            </p>
        </div>
        <img src="./images/privyr/dashboard/group-user.png" alt="User Icon" class="icon-circle">
    </div>

    
           <div class="summary-wrapper">

  <div class="summary-card blue">
    <img class="calenderIcon" src="/images/privyr/dashboard/today.png"/>
       <div class="top-line blue-line"></div>
     
     
    <div class="card-content">
        <div class="top-line blue-line"></div>
      <p class="title">Today's Leads</p>
      <h2 class="count">{{ todaysLeads }}</h2>
    </div>

    <div class="bottom-line blue-line"></div>
  </div>


  <div class="summary-card orange">
     <img class="calenderIcon" src="/images/privyr/dashboard/today2.png"/>
      <div class="top-line orange-line"></div>
    <div class="card-content">
      <p class="title">Untouched</p>
      <h2 class="count ">{{ untouchedLeads }}</h2>
    </div>
    <div class="bottom-line orange-line"></div>
  </div>


  <div class="summary-card green">
    <img class="calenderIcon" src="/images/privyr/dashboard/phonebook.png"/>
    <div class="top-line green-line"></div>
   

    <div class="card-content">
      <p class="title">Assigned</p>
      <h2 class="count ">{{ assignedLeads }}</h2>
    </div>

    <div class="bottom-line green-line"></div>
  </div>

</div>

<div class="dots">
  <span class="dot active"></span>
  <span class="dot"></span>
</div>

<!-- pagination dots 
            <h4>Assigned</h4>
            <h2>{{ assignedLeads }}</h2>
            
             <img class="card-img" src="/images/privyr/dashboard/today.png">
              <img class="card-img" src="/images/privyr/dashboard/untoched.png">
           -->
        </div>

    

    <div class="leads-title">
        <h2>Leads</h2>
        <input type="button" value="View All" class="view-all-btn">
    </div>

    <div class="search-section">
        <input type="text" placeholder="Search leads..." [(ngModel)]="searchText" (input)="applyFilters()" />

        <button class="search-btn">Search</button>
        <button class="refresh-btn" (click)="refresh()">Refresh</button>
    </div>
    <div class="filter-wrapper">
        <div class="filterHeader">
            <div><img class="filterIcon" src="images/privyr/dashboard/filter.png" />
                <span>Filters</span>
            </div>
            <img class="upOrDownArrow" src="/images/privyr/dashboard/upArrowIcon.jpg" />
        </div>
        <div class="filters">
            <div class="leadsStatus">
                <div>
                    Leads Status
                </div>
                <select [(ngModel)]="selectedStatus" (change)="applyFilters()">
                    <option value="All">All Status</option>
                    <option value="New">New</option>
                    <option value="Assigned">Assigned</option>
                    <option value="Untouched">Untouched</option>
                </select>
            </div>

            <div class="dateRange">
                <div>
                    Date Range
                </div>

                <input type="date" id="native-date" (change)="applyFilters()" [(ngModel)]="selectedDate" name="selectedDate">

            </div>

        </div>
    </div>

        <div class="leads-list">

        <div class="lead-card" *ngFor="let lead of filteredLeads">

            <div class="avatar">
                {{ lead.name.charAt(0) }}
            </div>

            <div class="lead-info">
                <h4>{{ lead.name }}</h4>
                <p>{{ lead.status }} Lead</p>
            </div>

            <div class="lead-meta">
                <span class="status" [ngClass]="{
                'assigned': lead.status === 'Assigned',
                'new': lead.status === 'New',
                'untouched': lead.status === 'Untouched'
              }">
                    {{ lead.status }}
                </span>
                <small>{{ lead.time }}</small>

            </div>

        </div>

    </div>
