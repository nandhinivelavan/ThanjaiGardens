<div class="page">

  <!-- ===== Onboarding Card ===== -->
  <div class="card">
    <div class="card-header">
      <span class="icon"><img src="/images/privyr/graduation.png"></span>
      <h3>GET STARTED WITH PRIVYR</h3>
    </div>

    <div class="task"
         *ngFor="let item of tasks"
         (click)="toggle(item)">
      <input type="checkbox" [(ngModel)]="item.done" />
      <span class="title">{{item.title}}</span>
      <span class="arrow">›</span>
    </div>
  </div>


  <!-- ===== Leads Summary ===== -->
  <div class="summary">

    <div class="summary-header">
      Past 7 days ▼ <span *ngIf="toggle" class="dropDown"></span>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">LEADS RECEIVED</div>
        <div class="value">0</div>
      </div>

      <div class="stat">
        <div class="label">LEADS CONTACTED</div>
        <div class="value">-</div>
      </div>

      <div class="stat">
        <div class="label">RESPONSE TIME</div>
        <div class="value">-</div>
      </div>
    </div>

    <div class="empty-row">NO UNCONTACTED LEADS ›</div>
    <div class="empty-row">NO CLIENTS VIEWED YOUR CONTENT ›</div>

  </div>


  <!-- ===== Bottom Navigation ===== -->
  <div class="bottom-nav">
    <div class="nav active"><img src="\images\privyr\home.png"><span>Home</span></div>
    <div class="nav"><img src="\images\privyr\capture.png"><span>Capture</span></div>
    <div class="nav"><img src="\images\privyr\clients.png"><span>Clients</span></div>
    <div class="nav"><img src="\images\privyr\actions.png"><span>Actions</span></div>
    <div class="nav"><img src="\images\privyr\content.png"><span>Content</span></div>
    <div class="nav"><img src="\images\privyr\account.png"><span>Account</span></div>
  </div>

</div>
